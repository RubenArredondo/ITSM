name: itsm

services:
  db:
    image: postgres:16-alpine
    container_name: itsm_db
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PSW}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${EXTERNAL_DB_PORT}:5432"
    networks:
      - itsm_network

  backend:
    build: ./backend
    container_name: itsm_backend
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "${DJANGO_PORT}:8000"
    networks:
      - itsm_network

networks:
  itsm_network:
    driver: bridge

volumes:
  postgres_data:

